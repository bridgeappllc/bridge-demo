<script>
const CFG=window.BRIDGE_CONFIG||{};
const CONFIGURED=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase);
// detectSessionInUrl: lets an emailed link work as a fallback; the app itself uses emailed one-time codes
const sb=CONFIGURED?supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"bridge-auth"}}):null;
const KEY="bridge_real_v1";
const PUBLIC_URL="https://bridgeappllc.github.io/bridge-demo/";
const NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()); // packaged iOS/Android app (see mobile/)
const APP_URL=NATIVE?PUBLIC_URL:location.origin+location.pathname;
const POLL_MS=+new URLSearchParams(location.search).get("poll")||4000; // ?poll=ms is only used by tests
const LOGO='<svg class="mk" viewBox="0 0 100 100" role="img" aria-label="Bridge logo" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M16 84C16 52 31 31 49 21" stroke="#2A2522" stroke-width="7"/><path d="M84 84C84 52 69 31 51 21" stroke="#A4492E" stroke-width="7"/></svg>';
const LOCK='<svg viewBox="0 0 24 24" fill="none" stroke="#A0452B" stroke-width="1.8"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const IC={people:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c.8-3.5 3.6-5.5 7-5.5s6.2 2 7 5.5"/><circle cx="17" cy="9" r="2.8"/><path d="M17 14.5c2.6 0 4.6 1.6 5 4.5"/>',bridges:'<path d="M4 20.5C4 13 7.5 8 11.6 5.5M20 20.5C20 13 16.5 8 12.4 5.5"/>',new:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>'};
const NAVL={people:"People",bridges:"Bridges",new:"New Bridge",profile:"Profile"};
const TOPICS=[["Politics","🏛️"],["Economics","📈"],["Culture","🎭"],["Education","🎓"],["Religion","🕊️"],["Science","🔬"]];
const QS=["What's one specific moment, insight, or story that stuck with you the most—and why?","Was there anything said that you strongly agreed or disagreed with? What was it?","If you had to describe the main takeaway in one or two sentences, what would you say—and did it change or reinforce how you see the topic?"];
const STEPS=["Invite","Answer","Talk"];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(String(u||""))?u:"#";
const normUrl=u=>{u=String(u||"").trim();return u&&!/^https?:\/\//i.test(u)?"https://"+u:u};
const kindOf=url=>/youtu|vimeo|video/i.test(url)?"Video":/podcast|spotify|\.mp3/i.test(url)?"Podcast":"Article";
const okEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

/* ---------- device-local data: small UI flags.
   Library, topics, name, bridges are stored in Supabase. Old local library items are migrated on load. ---------- */
const EXAMPLES=[]; // fictional Discover examples removed: Discover now shows friends' real library items
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||typeof S!=="object")S={};S.topics=S.topics||[];S.clips=S.clips||[];
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));save();
const legacyItems=()=>S.clips.filter(c=>c&&!c.ex&&c.url);

/* ---------- backend adapter (Supabase) ---------- */
let ME=null,USER=null,PROFILE=null;
const freshDB=()=>({list:null,d:{},pv:{},lib:null,flib:{},req:null,friends:null,sugg:null,blocks:null,feed:null,ppl:{},srch:{q:"",rows:null}});let DB=freshDB();
const isGuest=()=>!!USER&&USER.is_anonymous===true;
const ok=({data,error})=>{if(error)throw error;return data};
const BCOLS="id,invite_token,created_by,partner_left_at,clip_title,clip_url,clip_type,clip_cat,clip_creator,friend_label,reward,created_at,bridge_members(user_id,display_name,role,answered_at)";
const LCOLS="id,user_id,url,title,category,kind,creator,note,created_at";
const API={
 async boot(){const {data}=await sb.auth.getSession();const s=data.session;USER=s?s.user:null;ME=USER?USER.id:null;if(!s)return;
  PROFILE=ok(await sb.from("profiles").select("id,display_name,topics,username,bio,library_visibility").eq("id",ME).maybeSingle());if(PROFILE){S.topics=PROFILE.topics||[];save()}},
 async ensureUser(){if(ME)return;const d=ok(await sb.auth.signInAnonymously());USER=d.user;ME=USER.id},
 async saveProfile(p){await this.ensureUser();const row={display_name:p.display_name??PROFILE?.display_name,topics:p.topics??PROFILE?.topics??[]};
  if(PROFILE)ok(await sb.from("profiles").update({...row,updated_at:new Date().toISOString()}).eq("id",ME));else ok(await sb.from("profiles").insert({id:ME,...row}));PROFILE={username:null,bio:"",library_visibility:"friends",...(PROFILE||{}),id:ME,...row}},
 async updateProfile(f){ok(await sb.from("profiles").update({...f,updated_at:new Date().toISOString()}).eq("id",ME));Object.assign(PROFILE,f)},
 // social (see supabase/migrations/20261011090000_social_profiles_friends.sql)
 async people(q){return ok(await sb.rpc("search_people",{p_q:q}))},
 async profileOf(key){const a=key[0]==="@"?{p_username:key}:{p_id:key};const d=ok(await sb.rpc("get_profile",a));return(d&&d[0])||null},
 async friendsOf(uid){return ok(await sb.rpc("friends_of",{p_user:uid}))},
 async requests(){return ok(await sb.rpc("my_requests"))},
 async suggest(){return ok(await sb.rpc("suggest_people"))},
 async blocks(){return ok(await sb.rpc("my_blocks"))},
 async handleFree(u){return ok(await sb.rpc("username_available",{p_username:u}))},
 async sendReq(uid){return ok(await sb.rpc("send_friend_request",{p_user:uid}))},
 async respond(uid,yes){return ok(await sb.rpc("respond_friend_request",{p_user:uid,p_accept:yes}))},
 async removeFriend(uid){return ok(await sb.rpc("remove_friend",{p_user:uid}))},
 async block(uid){ok(await sb.rpc("block_user",{p_user:uid}))},
 async unblock(uid){ok(await sb.rpc("unblock_user",{p_user:uid}))},
 async addFriendToBridge(bid,uid){ok(await sb.rpc("add_friend_to_bridge",{p_bridge:bid,p_friend:uid}))},
 async feed(ids){return ok(await sb.from("library_items").select(LCOLS).in("user_id",ids).order("created_at",{ascending:false}).limit(60))},
 async signOut(){await sb.auth.signOut();ME=null;USER=null;PROFILE=null;DB=freshDB()},
 // store requirements (see supabase/migrations/20261011150000_account_deletion_and_reports.sql)
 async report(type,id,reason,note){return ok(await sb.rpc("report_content",{p_type:type,p_id:String(id),p_reason:reason,p_note:note||""}))},
 async deleteAccount(){ok(await sb.rpc("delete_my_account"));try{await sb.auth.signOut({scope:"local"})}catch(e){}
  try{localStorage.removeItem(KEY);localStorage.removeItem("bridge-auth")}catch(e){}ME=null;USER=null;PROFILE=null;DB=freshDB();S={topics:[],clips:[]}},
 async createBridge(o){return ok(await sb.rpc("create_bridge",{p_display_name:PROFILE.display_name,p_clip_title:o.title,p_clip_url:o.url,p_clip_type:o.type,p_clip_cat:o.cat||"",p_clip_creator:o.creator||"",p_friend_label:o.friend||"",p_reward:o.reward||""}))},
 async preview(t){const d=ok(await sb.rpc("preview_bridge",{p_token:t}));return(d&&d[0])||null},
 async join(t,name){return ok(await sb.rpc("join_bridge",{p_token:t,p_display_name:name}))},
 async list(){return ok(await sb.from("bridges").select(BCOLS).order("created_at",{ascending:false}))},
 async get(id){const[b,a,m]=await Promise.all([sb.from("bridges").select(BCOLS).eq("id",id).maybeSingle(),sb.from("answers").select("user_id,a1,a2,a3").eq("bridge_id",id),sb.from("messages").select("id,user_id,body,created_at").eq("bridge_id",id).order("id")]);
  return{b:ok(b),answers:ok(a),messages:ok(m)}},
 async answer(id,a){ok(await sb.from("answers").insert({bridge_id:id,user_id:ME,a1:a[0],a2:a[1],a3:a[2]}))},
 async send(id,t){ok(await sb.from("messages").insert({bridge_id:id,user_id:ME,body:t}))},
 // library
 async lib(uid){return ok(await sb.from("library_items").select(LCOLS).eq("user_id",uid||ME).order("created_at",{ascending:false}))},
 async item(id){return ok(await sb.from("library_items").select(LCOLS).eq("id",id).maybeSingle())},
 async addLib(it){const {data,error}=await sb.from("library_items").insert({user_id:ME,...it}).select(LCOLS).single();if(error&&error.code==="23505"){const e=new Error("Already in your library");e.dup=1;throw e}if(error)throw error;return data},
 async importLib(rows){if(rows.length)ok(await sb.from("library_items").upsert(rows.map(r=>({user_id:ME,...r})),{onConflict:"user_id,url",ignoreDuplicates:true}))},
 async removeLib(id){ok(await sb.from("library_items").delete().eq("id",id).eq("user_id",ME))},
 // email (one-time code). Guest -> keep account: updateUser({email}) converts the anonymous user in place.
 async saveEmail(email){ok(await sb.auth.updateUser({email},{emailRedirectTo:APP_URL}))},

${uid&&!isBlockedId(uid)?`<label class="chk"><input type="checkbox" id="rblock"> Also block ${esc(who)}</label>`:""}
<div class="row" style="margin-top:8px"><button class="btn o" id="rcancel">Cancel</button><button class="btn" id="rsend" disabled>Send report</button></div></div>`;
