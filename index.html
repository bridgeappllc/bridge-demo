};

</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bridge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
<style>
:root{--n:#14213d;--b:#2f6fd6;--bl:#eaf1fc;--m:#5b6680;--l:#e3e8f2;--g:#1f9d55;--r:#d64545}
*{box-sizing:border-box}html,body{margin:0;background:#eef2f8}
body{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--n);line-height:1.4}
#phone{max-width:430px;min-height:100vh;margin:0 auto;background:#fff;position:relative;box-shadow:0 0 40px rgba(20,33,61,.08)}
@media(min-width:600px){#phone{margin:20px auto;min-height:calc(100vh - 40px);border-radius:28px;overflow:hidden}}
header{position:sticky;top:0;z-index:5;background:#fff;display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--l)}
header b{font-size:1.25rem}header .sp{flex:1}
main{padding:16px 18px 100px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:flex;background:#fff;border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 0 11px;font:inherit;font-size:.75rem;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button svg{width:22px;height:22px}nav button.on{color:var(--b);font-weight:700}
h1{font-size:1.9rem;margin:10px 0 8px;line-height:1.15}h2{font-size:1.2rem;margin:18px 0 8px}
.mut{color:var(--m)}.sm{font-size:.85rem}.c{text-align:center}
.btn{display:block;width:100%;border:2px solid var(--b);background:var(--b);color:#fff;border-radius:999px;padding:13px;font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;margin:10px 0}
a.btn{text-decoration:none;text-align:center}.btn.o{background:#fff;color:var(--b)}.btn.s{display:inline-block;width:auto;padding:8px 16px;font-size:.9rem;margin:4px 0}.btn:disabled{opacity:.45}
.card{border:1px solid var(--l);border-radius:16px;padding:14px;margin:12px 0;background:#fff;box-shadow:0 2px 8px rgba(20,33,61,.04)}
.tag{display:inline-block;font-size:.7rem;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--bl);color:var(--b);margin-right:4px}
.tag.ex{background:#fff4e0;color:#a15c00}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}.chip{flex:none;border:1px solid var(--l);background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-size:.9rem;cursor:pointer;color:var(--n)}
.chip.on{background:var(--b);border-color:var(--b);color:#fff}
.tabs{display:flex;border-bottom:1px solid var(--l);margin-bottom:8px}.tabs button{flex:1;border:0;background:none;padding:10px;font:inherit;font-weight:600;color:var(--m);border-bottom:3px solid transparent;cursor:pointer}.tabs button.on{color:var(--b);border-color:var(--b)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.topic{border:2px solid var(--l);border-radius:16px;padding:18px 10px;text-align:center;font-weight:700;cursor:pointer;background:#fff;font:inherit;color:var(--n)}.topic span{display:block;font-size:1.8rem}.topic.on{border-color:var(--b);background:var(--bl)}
label{display:block;font-weight:600;margin:14px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid var(--l);border-radius:12px;font:inherit;color:var(--n);background:#fff}textarea{resize:vertical}
.scale{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,#d64545,#c9ced8 50%,#2f6fd6);margin:8px 0 4px}.scale i{position:absolute;top:-5px;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--n);transform:translateX(-50%)}
.sl{display:flex;justify-content:space-between;font-size:.72rem;color:var(--m)}
input[type=range]{padding:0;border:0;accent-color:var(--b)}
.emo{font-size:2.6rem;text-align:center}
.lock{background:var(--bl);border-radius:16px;padding:18px;text-align:center}.lock svg{width:36px;height:36px}
.bub{max-width:80%;padding:9px 13px;border-radius:16px;margin:6px 0;background:var(--bl)}.bub.me{margin-left:auto;background:var(--b);color:#fff}
.stat{display:flex;gap:10px}.stat div{flex:1;background:var(--bl);border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:1.5rem}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--n);color:#fff;padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:20}
a{color:var(--b)}.row{display:flex;gap:8px;align-items:center}
.steps{display:flex;gap:4px;margin:8px 0 14px}.steps button{flex:1;border:0;background:none;padding:0;font:inherit;font-size:.68rem;color:var(--m);text-align:center;cursor:pointer}
.steps button i{display:block;height:6px;border-radius:3px;background:var(--l);margin-bottom:5px}.steps .done i{background:var(--g)}.steps .done{color:var(--g)}.steps .cur i{background:var(--b)}.steps .cur{color:var(--b);font-weight:700}.steps .lk{opacity:.5}
.tabs.sc{overflow-x:auto}.tabs.sc button{flex:none;padding:10px 12px;font-size:.88rem}
.big{font-size:1.15rem;padding:16px}
.prog{font-size:.8rem;color:var(--m);margin-top:4px}.prog b{color:var(--n)}
.who{font-size:.7rem;color:var(--m);margin:8px 0 -4px}
.qa{border-left:3px solid var(--l);padding:2px 0 2px 10px;margin:6px 0}.qa.fr{border-color:var(--b)}
.note{background:#fff4e0;color:#7a4a00;border-radius:12px;padding:10px 12px;font-size:.85rem;margin:10px 0}
</style></head><body><div id="phone"><header id="hd"></header><main id="app"></main><nav id="nav"></nav></div>
<script>
const CFG=window.BRIDGE_CONFIG||{};
const CONFIGURED=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase);
// detectSessionInUrl: lets an emailed link work as a fallback; the app itself uses 6-digit codes
const sb=CONFIGURED?supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"bridge-auth"}}):null;
const KEY="bridge_real_v1";
const APP_URL=location.origin+location.pathname;
const POLL_MS=+new URLSearchParams(location.search).get("poll")||4000; // ?poll=ms is only used by tests
const LOGO='<svg viewBox="0 0 48 32" width="40" height="27" fill="none" stroke-linecap="round"><path d="M4 28 C10 6 38 6 44 28" stroke="#2f6fd6" stroke-width="4"/><path d="M12 28 C16 15 32 15 36 28" stroke="#14213d" stroke-width="3.5"/><path d="M2 28h44" stroke="#14213d" stroke-width="3"/></svg>';
const LOCK='<svg viewBox="0 0 24 24" fill="none" stroke="#14213d" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const IC={bridges:'<path d="M2 18C6 7 18 7 22 18M2 18h20M7 18v-4M12 18v-6M17 18v-4"/>',new:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>'};
const NAVL={bridges:"Bridges",new:"New Bridge",profile:"Profile"};
const TOPICS=[["Politics","🏛️"],["Economics","📈"],["Culture","🎭"],["Education","🎓"],["Religion","🕊️"],["Science","🔬"]];
const QS=["What's one specific moment, insight, or story that stuck with you the most—and why?","Was there anything said that you strongly agreed or disagreed with? What was it?","If you had to describe the main takeaway in one or two sentences, what would you say—and did it change or reinforce how you see the topic?"];
const STEPS=["Invite","Answer","Rate","Talk"];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(String(u||""))?u:"#";
const normUrl=u=>{u=String(u||"").trim();return u&&!/^https?:\/\//i.test(u)?"https://"+u:u};
const kindOf=url=>/youtu|vimeo|video/i.test(url)?"Video":/podcast|spotify|\.mp3/i.test(url)?"Podcast":"Article";
const okEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

/* ---------- device-local data: example clips (Discover) + small UI flags.
   Library, topics, name, bridges are stored in Supabase. Old local library items are migrated on load. ---------- */
const EXAMPLES=[
{id:"k1",ex:1,title:"The Thermostat Debate: Two Scientists Disagree",creator:"Open Lens Media (fictional)",type:"Video",cat:"Science",url:"https://example.com/video/thermostat-debate",rating:4.6,votes:212},
{id:"k2",ex:1,title:"Is 'Trump Derangement Syndrome' a Real Thing?",creator:"The Middle Ground Pod (fictional)",type:"Podcast",cat:"Politics",url:"https://example.com/podcast/tds-episode",rating:5.8,votes:347},
{id:"k3",ex:1,title:"Who Pays for Student Debt Forgiveness?",creator:"Main Street Economics (fictional)",type:"Article",cat:"Economics",url:"https://example.com/article/student-debt",rating:5.1,votes:98},
{id:"k4",ex:1,title:"Faith and Politics at the Dinner Table",creator:"Common Table Stories (fictional)",type:"Podcast",cat:"Religion",url:"https://example.com/podcast/dinner-table",rating:4.9,votes:156},
{id:"k5",ex:1,title:"What Schools Should Teach About History",creator:"Classroom Voices (fictional)",type:"Video",cat:"Education",url:"https://example.com/video/history-class",rating:3.8,votes:120}];
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||typeof S!=="object")S={};S.topics=S.topics||[];S.clips=S.clips||[];
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));save();
const legacyItems=()=>S.clips.filter(c=>c&&!c.ex&&c.url);

/* ---------- backend adapter (Supabase) ---------- */
let ME=null,USER=null,PROFILE=null;
const freshDB=()=>({list:null,d:{},pv:{},lib:null,flib:{},cr:{}});let DB=freshDB();
const isGuest=()=>!!USER&&USER.is_anonymous===true;
const ok=({data,error})=>{if(error)throw error;return data};
const BCOLS="id,invite_token,created_by,clip_title,clip_url,clip_type,clip_cat,clip_creator,friend_label,reward,created_at,bridge_members(user_id,display_name,role,answered_at,rated_at)";
const LCOLS="id,user_id,url,title,category,kind,creator,note,created_at";
const API={
 async boot(){const {data}=await sb.auth.getSession();const s=data.session;USER=s?s.user:null;ME=USER?USER.id:null;if(!s)return;
  PROFILE=ok(await sb.from("profiles").select("id,display_name,topics").eq("id",ME).maybeSingle());if(PROFILE){S.topics=PROFILE.topics||[];save()}},
 async ensureUser(){if(ME)return;const d=ok(await sb.auth.signInAnonymously());USER=d.user;ME=USER.id},
 async saveProfile(p){await this.ensureUser();const row={display_name:p.display_name??PROFILE?.display_name,topics:p.topics??PROFILE?.topics??[]};
  if(PROFILE)ok(await sb.from("profiles").update({...row,updated_at:new Date().toISOString()}).eq("id",ME));else ok(await sb.from("profiles").insert({id:ME,...row}));PROFILE={id:ME,...row}},
 async signOut(){await sb.auth.signOut();ME=null;USER=null;PROFILE=null;DB=freshDB();crAsked.clear()},
 async createBridge(o){return ok(await sb.rpc("create_bridge",{p_display_name:PROFILE.display_name,p_clip_title:o.title,p_clip_url:o.url,p_clip_type:o.type,p_clip_cat:o.cat||"",p_clip_creator:o.creator||"",p_friend_label:o.friend||"",p_reward:o.reward||""}))},
 async preview(t){const d=ok(await sb.rpc("preview_bridge",{p_token:t}));return(d&&d[0])||null},
 async join(t,name){return ok(await sb.rpc("join_bridge",{p_token:t,p_display_name:name}))},
 async list(){return ok(await sb.from("bridges").select(BCOLS).order("created_at",{ascending:false}))},
 async get(id){const[b,a,r,m]=await Promise.all([sb.from("bridges").select(BCOLS).eq("id",id).maybeSingle(),sb.from("answers").select("user_id,a1,a2,a3").eq("bridge_id",id),sb.from("ratings").select("user_id,score").eq("bridge_id",id),sb.from("messages").select("id,user_id,body,created_at").eq("bridge_id",id).order("id")]);
  return{b:ok(b),answers:ok(a),ratings:ok(r),messages:ok(m)}},
 async answer(id,a){ok(await sb.from("answers").insert({bridge_id:id,user_id:ME,a1:a[0],a2:a[1],a3:a[2]}))},
 async rate(id,v){ok(await sb.from("ratings").insert({bridge_id:id,user_id:ME,score:v}))},
 async send(id,t){ok(await sb.from("messages").insert({bridge_id:id,user_id:ME,body:t}))},
 // library
 async lib(uid){return ok(await sb.from("library_items").select(LCOLS).eq("user_id",uid||ME).order("created_at",{ascending:false}))},
 async item(id){return ok(await sb.from("library_items").select(LCOLS).eq("id",id).maybeSingle())},
 async addLib(it){const {data,error}=await sb.from("library_items").insert({user_id:ME,...it}).select(LCOLS).single();if(error&&error.code==="23505"){const e=new Error("Already in your library");e.dup=1;throw e}if(error)throw error;return data},
 async importLib(rows){if(rows.length)ok(await sb.from("library_items").upsert(rows.map(r=>({user_id:ME,...r})),{onConflict:"user_id,url",ignoreDuplicates:true}))},
 async removeLib(id){ok(await sb.from("library_items").delete().eq("id",id).eq("user_id",ME))},
 async community(urls){return urls.length?ok(await sb.rpc("community_ratings",{p_urls:urls})):[]},
 // email (6-digit code). Guest -> keep account: updateUser({email}) converts the anonymous user in place.
 async saveEmail(email){ok(await sb.auth.updateUser({email},{emailRedirectTo:APP_URL}))},
 async confirmEmail(email,token){ok(await sb.auth.verifyOtp({email,token,type:"email_change"}));const {data}=await sb.auth.getUser();if(data&&data.user)USER=data.user},
 async sendSignIn(email){ok(await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:APP_URL}}))},
 async confirmSignIn(email,token){ok(await sb.auth.verifyOtp({email,token,type:"email"}));PROFILE=null;DB=freshDB();await this.boot()},
 // live updates: Supabase Realtime when available + polling fallback
 watch(id,cb,ms){let ch=null;if(id){try{ch=sb.channel("bridge:"+id+":"+Math.random().toString(36).slice(2));for(const t of["messages","bridge_members","answers","ratings"])ch.on("postgres_changes",{event:"*",schema:"public",table:t,filter:"bridge_id=eq."+id},()=>cb());ch.on("system",{},m=>{if(m&&m.extension==="postgres_changes")window.__bridgeRealtimePg=m.status});window.__bridgeRealtimePg=null;ch.subscribe(st=>{window.__bridgeRealtime=st})}catch(e){ch=null}}
  const iv=setInterval(()=>{if(!document.hidden)cb()},ms||4000);return()=>{clearInterval(iv);if(ch)sb.removeChannel(ch)}}};
if(sb)sb.auth.onAuthStateChange((ev,session)=>{USER=session?session.user:null;ME=USER?USER.id:null});

/* ---------- helpers ---------- */
const lbl=v=>v<3.5?"Propaganda":v>6.5?"Redpilled":"Neutral";
const emo=v=>["😠","😠","😒","😕","🤔","😐","🙂","😊","😃","🤯","🔥"][Math.round(v)];
function toast(t){$$(".toast").forEach(x=>x.remove());const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
const fail=e=>{console.error(e);toast(e&&e.message?e.message:"Something went wrong — try again")};
const authMsg=e=>{const c=(e&&(e.code||e.error_code))||"",m=(e&&e.message)||"";
 if(c==="otp_disabled"||/signups not allowed/i.test(m))return"No Bridge account uses that email yet. Start as a guest (Sign Up Free), then save your account with this email.";
 if(c==="email_exists"||/already been registered/i.test(m))return"That email already has a Bridge account.";
 if(c==="otp_expired"||/expired or is invalid/i.test(m))return"That code is wrong or expired. Check the newest email, or send a new code.";
 if(c==="over_email_send_rate_limit"||/rate limit|security purposes|after \d+ seconds/i.test(m))return"Too many emails just now. Please wait a bit and try again.";
 if(c==="email_address_not_authorized"||/not authorized/i.test(m))return"We can't send email to that address yet (email isn't fully set up). Please try again later.";
 if(c==="email_address_invalid"||/invalid format|is invalid/i.test(m))return"That email address doesn't look right.";
 return m||"Something went wrong. Try again."};
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Copied to clipboard"),()=>prompt("Copy this:",t))}
function share(t){if(navigator.share)navigator.share({text:t}).catch(()=>{});else copy(t)}
const go=h=>location.hash=h;
const busy=(el,on)=>{if(el){el.disabled=on;if(on){el.dataset.t=el.textContent;el.textContent="…"}else if(el.dataset.t)el.textContent=el.dataset.t}};
const inviteLink=b=>APP_URL+"#b/"+b.invite_token;
const inviteTxt=b=>`Meet me on the Bridge: listen to "${b.clip_title}" in the next 3 days.\n${b.clip_url}${+b.reward>0?`\nI'll send you $${b.reward} when you finish it.`:""}\nThen join me here to answer 3 quick questions, rate it, and talk about where we see it differently:\n${inviteLink(b)}`;
const meOf=b=>(b.bridge_members||[]).find(m=>m.user_id===ME),frOf=b=>(b.bridge_members||[]).find(m=>m.user_id!==ME);
const frName=b=>{const f=frOf(b);return f?f.display_name:(meOf(b)?.role==="owner"?(b.friend_label||"your friend"):"your friend")};
const partners=()=>{const m=new Map();(DB.list||[]).forEach(b=>{const f=frOf(b);if(f&&!m.has(f.user_id))m.set(f.user_id,f.display_name)});return[...m].map(([user_id,name])=>({user_id,name}))};
const nameOf=uid=>(partners().find(p=>p.user_id===uid)||{}).name;
// stage for me: 1 Answer, 2 Rate, 3 Talk (0 Invite is done once the bridge exists)
const stage=m=>!m||!m.answered_at?1:!m.rated_at?2:3;
const progTxt=(m,invited)=>!m?`${esc(invited)}: <b>not joined yet</b>`:`${m.user_id===ME?"You":esc(m.display_name)}: ${m.rated_at?"<b>✓ answered · ✓ rated</b>":m.answered_at?"<b>✓ answered</b> · rating next":"joined · answering next"}`;
function scale(v){return `<div class="scale"><i style="left:${v*10}%"></i></div><div class="sl"><span>Propaganda</span><span>Neutral</span><span>Redpilled</span></div>`}
function stepbar(cur,reach,id,first){return `<div class="steps">${STEPS.map((t,i)=>{if(i===0&&first)t=first;const cl=i<reach?"done":i===cur?"cur":i>reach?"lk":"";return `<button class="${cl}${i===cur?" cur":""}" ${id&&i<=reach?`onclick="go('bridge/${id}/${i}')"`:""}><i></i>${i<reach?"✓ ":i>reach?"🔒 ":""}${t}</button>`}).join("")}</div>`}
// clips: examples (local, fictional ratings) or library items (online)
const fromItem=it=>({id:it.id,title:it.title,creator:it.creator,type:it.kind,cat:it.category,url:it.url,note:it.note,owner:it.user_id});
function findClip(id){const e=EXAMPLES.find(c=>c.id===id);if(e)return e;const it=[...(DB.lib||[]),...Object.values(DB.flib).flat()].find(x=>x.id===id);return it?fromItem(it):null}
const inMyLib=url=>(DB.lib||[]).find(x=>x.url===url);
const crOf=c=>c.ex?{avg:c.rating,n:c.votes}:DB.cr[c.url];
const crLine=c=>{const r=crOf(c);return r?`Community rating: <b>${lbl(r.avg)} ${r.avg.toFixed(1)}</b> <span class="mut">(${r.n})</span>`:'Community rating: <span class="mut">not enough ratings yet</span>'};
function clipCard(c){const r=crOf(c);return `<div class="card" style="cursor:pointer" onclick="go('clip/${c.id}')">${c.ex?'<span class="tag ex">Example</span>':""}<span class="tag">${esc(c.cat||"Other")}</span><span class="tag">${esc(c.type)}</span>
<div style="font-weight:700;font-size:1.05rem;margin:8px 0 2px">${esc(c.title)}</div><div class="mut sm">${esc(c.creator)}</div>${c.note?`<div class="sm" style="margin-top:6px">“${esc(c.note)}”</div>`:""}
<div class="sm" style="margin-top:10px">${crLine(c)}</div>${r?scale(r.avg):""}</div>`}
const loading='<p class="mut c" style="padding-top:40px">Loading…</p>';
const saveNote=where=>isGuest()?`<div class="note" id="savenote">💾 <b>Save your account</b> so you can get ${where} back on another phone. <a href="#account">Add your email</a></div>`:"";
const bridgeCard=b=>{const me=meOf(b),fr=frOf(b),st=stage(me);return `<div class="card" style="cursor:pointer" onclick="go('bridge/${b.id}')"><span class="tag">${esc(b.clip_type)}</span>${me&&me.role==="friend"?'<span class="tag">Invited by '+esc(fr?fr.display_name:"friend")+"</span>":""}<div style="font-weight:700;margin:6px 0 2px">You & ${esc(frName(b))}</div><div class="mut sm">${esc(b.clip_title)}</div>
${stepbar(st,st)}<div class="sm">${st===3?"💬 Chat open":"Next: <b>"+STEPS[st]+"</b>"}</div><div class="prog">${progTxt(me)}<br>${progTxt(fr,frName(b))}</div></div>`};
// 2-step email + code form (used by sign-in and save-account)
const codeForm=(title,intro,btn)=>`<h1 style="font-size:1.6rem">${title}</h1><p class="mut">${intro}</p><div id="ef"><label>Email</label><input id="em" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com"><button class="btn" id="esend">${btn}</button></div>

/* ---------- router / render ---------- */
let lastKey="",unwatch=null;
const parse=()=>{const [r,id,sp]=(location.hash.slice(1)||"").split("/");return{r,id,sp}};
function viewOf(){const {r}=parse();if(!CONFIGURED)return"setup";if(r==="b")return"invite";if(r==="signin")return"signin";if(!PROFILE)return"welcome";if(!V[r]||["welcome","setup","invite","signin"].includes(r))return"bridges";return r}
function snapshot(){const els=$$("#app input,#app textarea,#app select");const a=document.activeElement;return{vals:els.map(e=>e.value),focus:els.indexOf(a),sel:a&&a.selectionStart!=null?[a.selectionStart,a.selectionEnd]:null,y:window.scrollY}}
function restore(s){const els=$$("#app input,#app textarea,#app select");if(els.length===s.vals.length)els.forEach((e,i)=>{if(e.type!=="hidden"&&!e.readOnly)e.value=s.vals[i]});const f=els[s.focus];if(f){f.focus();if(s.sel)try{f.setSelectionRange(...s.sel)}catch(e){}}window.scrollTo(0,s.y)}
const sig=o=>JSON.stringify(o);
const shown={}; // data signature as of the last successful render of each view (so a failed render self-heals on the next poll)
const viewData=(v,id)=>v==="bridge"?DB.d[id]:v==="bridges"?DB.list:v==="profile"?[DB.list,DB.lib,DB.cr]:v==="lib"?[DB.flib[id],DB.list,DB.cr]:v==="clip"||v==="new"?[DB.lib,DB.flib,DB.cr,DB.list]:null;
function render(refresh){const {id,sp}=parse(),v=viewOf(),key=v+"/"+id+"/"+(sp||"");const keep=refresh&&key===lastKey?snapshot():null;
if(refresh&&v==="new"&&$("#mout")&&$("#mout").innerHTML)return; // never wipe a freshly created invite
const app=!["welcome","topics","setup","invite","signin"].includes(v);$("#hd").innerHTML=LOGO+`<b>Bridge</b><span class="sp"></span>${PROFILE?`<span class="mut sm">Hi, ${esc(PROFILE.display_name)}</span>`:""}`;
$("#nav").style.display=app?"flex":"none";const tab={bridges:"bridges",bridge:"bridges",new:"new",profile:"profile",clip:"profile",lib:"profile",account:"profile"}[v];
$("#nav").innerHTML=["bridges","new","profile"].map(k=>`<button class="${k===tab?"on":""}" onclick="go('${k}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">${IC[k]}</svg>${NAVL[k]}</button>`).join("");
$("#app").innerHTML=V[v](id,sp);if(keep)restore(keep);else if(key!==lastKey)window.scrollTo(0,0);lastKey=key;(B[v]||(()=>{}))(id,sp);
shown[key]=sig(viewData(v,id));
if(v==="bridge"&&$("#chat")){const n=DB.d[id].messages.length;if(n!==lastMsgCount&&(!keep||n>lastMsgCount))window.scrollTo(0,document.body.scrollHeight);lastMsgCount=n}else lastMsgCount=-1}
const rerender=()=>{const {id,sp}=parse(),v=viewOf(),key=v+"/"+id+"/"+(sp||"");if(sig(viewData(v,id))!==shown[key])render(true)};
const crAsked=new Set();
async function loadCR(urls){urls=[...new Set(urls)].filter(u=>u&&!crAsked.has(u));if(!urls.length)return;urls.forEach(u=>crAsked.add(u));
 try{(await API.community(urls)).forEach(r=>DB.cr[r.url]={avg:+r.avg_score,n:r.ratings})}catch(e){urls.forEach(u=>crAsked.delete(u));console.warn(e)}}
async function loadList(){try{DB.list=await API.list();rerender()}catch(e){fail(e)}}
async function loadLib(){try{DB.lib=await API.lib();await loadCR(DB.lib.map(x=>x.url));rerender()}catch(e){fail(e)}}
async function loadFlib(uid){try{DB.flib[uid]=await API.lib(uid);await loadCR(DB.flib[uid].map(x=>x.url));rerender()}catch(e){fail(e)}}
async function loadItem(id){if(findClip(id))return;DB.flib.__loading=1;try{const it=await API.item(id);if(it&&it.user_id!==ME)DB.flib[it.user_id]=[...(DB.flib[it.user_id]||[]),it]}catch(e){console.warn(e)}delete DB.flib.__loading;const c=findClip(id);if(c)await loadCR([c.url]);render(true)}
async function loadBridge(id){try{DB.d[id]=await API.get(id);if(parse().id===id)rerender()}catch(e){fail(e)}}
async function loadPreview(t){try{const p=await API.preview(t);DB.pv[t]=p;if(p&&p.is_member&&PROFILE){go("bridge/"+p.bridge_id);return}render(true)}catch(e){DB.pv[t]=null;fail(e)}}
// one-time move of library items saved on this device (older app version) into the account
async function migrateLocal(){const items=legacyItems();if(!PROFILE||!items.length)return;
 try{await API.importLib(items.map(c=>({url:normUrl(c.url).slice(0,2000),title:String(c.title||c.url).slice(0,300),category:String(c.cat||"").slice(0,40),kind:String(c.type||kindOf(c.url)).slice(0,20),creator:c.creator==="Added by you"?"":String(c.creator||"").slice(0,120),note:String(c.note||"").slice(0,300)})).filter(r=>/^https?:\/\//i.test(r.url)));
  S.clips=S.clips.filter(c=>c.ex);save();loadLib();toast(`Moved ${items.length} saved item${items.length>1?"s":""} into your online library`)}catch(e){console.warn("library migration failed; will retry",e)}}
function onRoute(){if(unwatch){unwatch();unwatch=null}render();if(!CONFIGURED)return;const v=viewOf(),{id}=parse();
 if(v==="bridges"){loadList();unwatch=API.watch(null,loadList,10000)}
 if(v==="profile"){loadList();loadLib();unwatch=API.watch(null,()=>{loadList();loadLib()},10000)}
 if(v==="new"){loadLib();if(DB.list===null)loadList()}
 if(v==="clip"){if(DB.list===null)loadList();(DB.lib===null?loadLib():Promise.resolve()).then(()=>{if(!EXAMPLES.some(c=>c.id===id)){if(findClip(id))loadCR([findClip(id).url]).then(rerender);else loadItem(id)}})}
 if(v==="lib"){if(id===ME){go("profile");return}if(DB.list===null)loadList();loadFlib(id)}
 if(v==="bridge"){loadBridge(id);unwatch=API.watch(id,()=>loadBridge(id),POLL_MS)}
 if(v==="invite")loadPreview(id)}

/* ---------- behaviour ---------- */
// wires the email -> code form. send(email) and confirm(email, code) are async; onExists optional
function bindCodeForm(send,confirm,onExists){let email="";const msg=t=>{$("#emsg").textContent=t||""};
 const doSend=async()=>{const e=$("#em").value.trim().toLowerCase();if(!okEmail(e))return msg("Please enter a valid email address.");msg("");busy($("#esend"),true);busy($("#cres"),true);
  try{await send(e);email=e;$("#emto").textContent=e;$("#ef").style.display="none";$("#cf").style.display="block";$("#code").value="";$("#code").focus();toast("Code sent — check your email")}
  catch(err){console.warn(err);msg(authMsg(err));if(onExists&&/already/.test(authMsg(err)))onExists(e)}busy($("#esend"),false);busy($("#cres"),false)};
 const doOk=async()=>{const c=$("#code").value.replace(/\D/g,"");if(c.length<6)return msg("Enter the 6-digit code from the email.");msg("");busy($("#cok"),true);
  try{await confirm(email,c)}catch(err){console.warn(err);msg(authMsg(err));busy($("#cok"),false)}};
 $("#esend").onclick=doSend;$("#em").onkeydown=e=>{if(e.key==="Enter")doSend()};$("#cok").onclick=doOk;$("#code").onkeydown=e=>{if(e.key==="Enter")doOk()};
 $("#cres").onclick=doSend;$("#cback").onclick=()=>{$("#cf").style.display="none";$("#ef").style.display="block";msg("")}}
const B={
welcome(){const ask=t=>{$("#su").innerHTML=`<label style="text-align:left">${t}</label><input id="nm" placeholder="Your name" maxlength="40"><button class="btn" id="nok">Continue</button><p class="mut sm">No email or password needed to start.</p>`;$("#nm").focus();
 const done=async()=>{const n=$("#nm").value.trim();if(!n)return toast("Please enter your name");busy($("#nok"),true);try{await API.saveProfile({display_name:n,topics:S.topics});await migrateLocal();go("topics");onRoute()}catch(e){busy($("#nok"),false);fail(e)}};$("#nok").onclick=done;$("#nm").onkeydown=e=>{if(e.key==="Enter")done()}};
 $("#sbtn").onclick=()=>ask("What's your name?")},
signin(){bindCodeForm(e=>API.sendSignIn(e),async(e,c)=>{await API.confirmSignIn(e,c);await migrateLocal();toast(PROFILE?`Welcome back, ${PROFILE.display_name}`:"Signed in");const a=S.after;delete S.after;save();go(a||"bridges");onRoute()})},
account(){if(!isGuest())return;bindCodeForm(e=>API.saveEmail(e),async(e,c)=>{await API.confirmEmail(e,c);toast("Account saved ✓");profTab="Settings";go("profile")},()=>{$("#exists").style.display="block"});
 const ts=$("#toSignin");if(ts)ts.onclick=async()=>{if(!confirm("Switch accounts? You'll leave this guest account, and its bridges stay with it."))return;await API.signOut();go("signin")}},
topics(){$$(".topic").forEach(b=>b.onclick=()=>{const t=b.dataset.t;S.topics=S.topics.includes(t)?S.topics.filter(x=>x!==t):[...S.topics,t];save();render()});
 $("#tgo").onclick=async()=>{try{await API.saveProfile({topics:S.topics})}catch(e){fail(e)}go("bridges")}},
invite(tok){const js=$("#jsignin");if(js)js.onclick=()=>{S.after="b/"+tok;save()};const j=$("#jgo");if(!j)return;const doJoin=async()=>{const n=$("#jname").value.trim();if(!n)return toast("Please enter your name");busy(j,true);
 try{if(!PROFILE){await API.saveProfile({display_name:n,topics:[]});migrateLocal()}else await API.ensureUser();const id=await API.join(tok,n);DB.list=null;toast("You're on the bridge 🌉");go("bridge/"+id+"/1")}catch(e){busy(j,false);fail(e)}};
 j.onclick=doJoin;$("#jname").onkeydown=e=>{if(e.key==="Enter")doJoin()}},
bridges(){const n=$("#nosave");if(n)n.onclick=e=>{e.stopPropagation();S.hideSave=1;save();render()}},
new(){const sel=$("#mclip");sel.onchange=()=>$("#paste").style.display=sel.value?"none":"block";
$("#mgo").onclick=async()=>{let c=findClip(sel.value),fresh=false;if(!c){const url=normUrl($("#murl").value);if(!url)return toast("Paste a link or pick a clip");
 c={title:$("#mtitle").value.trim()||url,creator:"",type:kindOf(url),cat:S.topics[0]||"",url};fresh=true}
 const f=$("#mfriend").value.trim(),rew=$("#mrew").value.trim();busy($("#mgo"),true);
 try{const b=await API.createBridge({title:c.title.slice(0,300),url:c.url,type:c.type,cat:c.cat,creator:c.ex?"":c.creator,friend:f,reward:rew&&+rew>0?String(Math.round(+rew)):""});
  if(fresh)API.importLib([{url:c.url,title:c.title.slice(0,300),category:c.cat,kind:c.type,creator:"",note:""}]).then(()=>{DB.lib=null}).catch(e=>console.warn(e));
  b.bridge_members=[{user_id:ME,display_name:PROFILE.display_name,role:"owner"}];DB.list=null;
  const txt=inviteTxt(b);$("#mout").innerHTML=`<div class="card"><b>Invite for ${esc(f||"your friend")}</b><p class="mut sm">Text this to your friend. The link at the end lets them join.</p><textarea rows="9" readonly id="itxt">${esc(txt)}</textarea><button class="btn o" id="cp">Copy invite text</button>${navigator.share?'<button class="btn o" id="sh">Share…</button>':""}<button class="btn" id="nx" onclick="go('bridge/${b.id}/1')">Next: Answer 3 questions</button></div>${saveNote("this bridge")}`;
  $("#cp").onclick=()=>copy(txt);if($("#sh"))$("#sh").onclick=()=>share(txt);$("#mgo").style.display="none"}catch(e){busy($("#mgo"),false);fail(e)}}},
clip(id){const c=findClip(id);if(!c)return;
 const a=$("#addlib");if(a)a.onclick=async()=>{busy(a,true);try{const it=await API.addLib({url:c.url,title:c.title.slice(0,300),category:c.cat||"",kind:c.type||kindOf(c.url),creator:c.ex?"":(c.creator||"").slice(0,120),note:""});DB.lib=[it,...(DB.lib||[])];toast("Added to your Library");render(true)}catch(e){busy(a,false);if(e.dup){toast(e.message)}else fail(e)}};
 const r=$("#rmlib");if(r)r.onclick=async()=>{if(!confirm("Remove this from your library?"))return;busy(r,true);try{await API.removeLib(id);DB.lib=(DB.lib||[]).filter(x=>x.id!==id);toast("Removed");profTab="Library";go("profile")}catch(e){busy(r,false);fail(e)}}},
bridge(id){const D=DB.d[id];if(!D||!D.b)return;const b=D.b;
if($("#cpi"))$("#cpi").onclick=()=>copy(inviteTxt(b));if($("#shi"))$("#shi").onclick=()=>share(inviteTxt(b));
$$(".q").forEach(t=>t.oninput=()=>$("#qhint").textContent="");const q=$("#qsave");if(q)q.onclick=async()=>{const a=$$(".q").map(t=>t.value.trim());if(a.some(x=>x.length<3))return $("#qhint").textContent="Please answer all three questions to continue.";
 if(!confirm("Submit your answers? You can't edit them afterwards."))return;busy(q,true);try{await API.answer(id,a);await loadBridge(id);go(`bridge/${id}/2`)}catch(e){busy(q,false);fail(e)}};
const rs=$("#rs");if(rs){rs.oninput=e=>{const v=+e.target.value;$("#emo").textContent=emo(v);$("#rl").textContent=lbl(v)+" · "+v};
 $("#rsave").onclick=async()=>{busy($("#rsave"),true);try{await API.rate(id,+rs.value);await loadBridge(id);toast("Chat unlocked 💬");go(`bridge/${id}/3`)}catch(e){busy($("#rsave"),false);fail(e)}}}
const cs=$("#cs");if(cs){let sending=false;const send=async()=>{const t=$("#ct").value.trim();if(!t||sending)return;sending=true;cs.disabled=true;try{await API.send(id,t);$("#ct").value="";await loadBridge(id)}catch(e){fail(e)}sending=false;if($("#cs"))$("#cs").disabled=false;if($("#ct"))$("#ct").focus()};cs.onclick=send;$("#ct").onkeydown=e=>{if(e.key==="Enter")send()}}},
profile(){$$("[data-pt]").forEach(b=>b.onclick=()=>{profTab=b.dataset.pt;render()});$$("[data-cat]").forEach(b=>b.onclick=()=>{feedCat=b.dataset.cat;render()});
const an=$("#anote");if(an){an.oninput=e=>$("#cnt").textContent=e.target.value.length;$("#asave").onclick=async()=>{const url=normUrl($("#aurl").value);if(!url)return toast("Please paste a link");busy($("#asave"),true);
 try{const it=await API.addLib({url,title:($("#atitle").value.trim()||url).slice(0,300),category:$("#acat").value,kind:kindOf(url),creator:"",note:an.value.trim()});DB.lib=[it,...(DB.lib||[])];toast("Saved to your Library");profTab="Library";go("clip/"+it.id)}catch(e){busy($("#asave"),false);if(e.dup)toast(e.message);else fail(e)}}}
const ps=$("#psave");if(ps)ps.onclick=async()=>{const n=$("#pname").value.trim();if(!n)return toast("Please enter your name");try{await API.saveProfile({display_name:n});toast("Saved");render()}catch(e){fail(e)}};
const so=$("#sout");if(so)so.onclick=async()=>{if(!confirm(isGuest()?"Sign out? This is a guest account, so you won't be able to get back to your bridges or library. Save your account with your email first to keep them.":"Sign out of Bridge on this device? Sign back in any time with your email."))return;try{await API.signOut()}catch(e){}go("");onRoute()}}};

/* ---------- boot ---------- */
(async()=>{const qb=new URLSearchParams(location.search).get("b");if(qb){history.replaceState(null,"",location.pathname+"#b/"+encodeURIComponent(qb))}
$("#app").innerHTML=loading;if(CONFIGURED){try{await API.boot();await migrateLocal()}catch(e){fail(e)}}window.onhashchange=onRoute;onRoute()})();
